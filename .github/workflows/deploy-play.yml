name: Deploy Vrowser Playground
on:
  workflow_dispatch: # eslint-disable-line yml/no-empty-mapping-value -- disalbe

jobs:
  deploy:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      deployments: write

    steps:
      - name: Checkout codes
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          submodules: false

      - name: Install pnpm
        uses: pnpm/action-setup@41ff72655975bd51cab0327fa583b6e92b6d3061 # v4.2.0

      - name: Setup node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate manifests (CJS to ESM bundles)
        run: |
          pnpm gen:manifest packages/play-vrowser/package.json -p packages/play-vrowser/fixtures/vite-vue -o packages/play-vrowser/fixtures/vite-vue/vrowser-manifest.json -t vue --name "Vrowser + Vue"
          pnpm gen:manifest packages/play-vrowser/package.json -p packages/play-vrowser/fixtures/vite-react -o packages/play-vrowser/fixtures/vite-react/vrowser-manifest.json -t react -t react-dom --name "Vrowser + React"
          pnpm gen:manifest packages/play-vrowser/package.json -p packages/play-vrowser/fixtures/vite-svelte -o packages/play-vrowser/fixtures/vite-svelte/vrowser-manifest.json -t svelte --name "Vrowser + Svelte"

      - name: Build vite-dev-server (bundle + types, allow types failure)
        run: |
          pnpm --filter "vite-dev-server^..." run build
          pnpm --filter vite-dev-server run build-bundle
          pnpm --filter vite-dev-server run build-types || echo "Warning: vite-dev-server types build failed (non-critical)"

      - name: Build play-vrowser
        run: pnpm --filter "play-vrowser..." --filter "!vite-dev-server" run build

      - name: Debug config.bundled.mjs
        if: always()
        run: |
          echo "=== config.bundled.mjs ==="
          BUNDLED=$(find packages/play-vrowser -name "config.bundled.mjs" 2>/dev/null | head -1)
          if [ -n "$BUNDLED" ]; then
            echo "Found: $BUNDLED"
            grep -n "skipFastRefresh\|transformIndexHtml\|isProduction\|getPreambleCode\|react-refresh\|RefreshSig" "$BUNDLED" | head -30
          else
            echo "config.bundled.mjs not found (cleaned up after build)"
            echo "--- Checking web-worker JS for preamble ---"
            WW=$(find packages/play-vrowser/dist/assets -name "web-worker-*.js" 2>/dev/null | head -1)
            if [ -n "$WW" ]; then
              echo "Web Worker: $WW ($(wc -c < "$WW") bytes)"
              grep -c "transformIndexHtml" "$WW"
              grep -c "RefreshSig" "$WW"
              grep -c "getPreambleCode" "$WW"
              # Check the actual preamble code generation
              grep -o 'getPreambleCode.*' "$WW" | head -3
              # Check skipFastRefresh initialization
              grep -o 'skipFastRefresh = [^;]*;' "$WW" | head -5
              # Check isRolldownVite
              grep -o 'isRolldownVite = [^;]*;' "$WW" | head -3
              # Check the plugin array return
              grep -o 'isRolldownVite ? \[.*\] : \[\]' "$WW" | head -3
            fi
          fi

      - name: Create cloudflare pages project (if not exists)
        uses: cloudflare/wrangler-action@da0e0dfe58b7a431659754fdf3f186c529afbe65 # v3.14.1
        continue-on-error: true
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages project create vrowser-playground --production-branch=main

      - name: Deploy cloudflare pages
        uses: cloudflare/wrangler-action@da0e0dfe58b7a431659754fdf3f186c529afbe65 # v3.14.1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy packages/play-vrowser/dist --project-name=vrowser-playground --commit-dirty=true
