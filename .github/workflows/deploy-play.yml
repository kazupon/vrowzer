name: Deploy Vrowser Playground
on:
  workflow_dispatch: # eslint-disable-line yml/no-empty-mapping-value -- disalbe

jobs:
  deploy:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      deployments: write

    steps:
      - name: Checkout codes
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          submodules: false

      - name: Install pnpm
        uses: pnpm/action-setup@41ff72655975bd51cab0327fa583b6e92b6d3061 # v4.2.0

      - name: Setup node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build vite-dev-server dependencies
        run: pnpm --filter "vite-dev-server^..." run build

      - name: Build vite-dev-server (bundle only, skip dts)
        run: pnpm --filter vite-dev-server run build-bundle

      - name: Build play-vrowser
        run: pnpm --filter play-vrowser... run build

      - name: Create cloudflare pages project (if not exists)
        uses: cloudflare/wrangler-action@da0e0dfe58b7a431659754fdf3f186c529afbe65 # v3.14.1
        continue-on-error: true
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages project create vrowser-playground --production-branch=main

      - name: Deploy cloudflare pages
        uses: cloudflare/wrangler-action@da0e0dfe58b7a431659754fdf3f186c529afbe65 # v3.14.1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy packages/play-vrowser/dist --project-name=vrowser-playground --commit-dirty=true
