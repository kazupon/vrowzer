[package]
name = "vrowser-oxc-parser"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[package.metadata.wasm-pack.profile.release]
wasm-opt = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# oxc crates
oxc_allocator = "0.113"
oxc_ast = { version = "0.113", features = ["serialize"] }
oxc_ast_visit = { version = "0.113", features = ["serialize"] }
oxc_diagnostics = "0.113"
oxc_parser = "0.113"
oxc_semantic = "0.113"
oxc_span = { version = "0.113", features = ["serialize"] }
oxc_syntax = "0.113"

# wasm-bindgen
wasm-bindgen = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde-wasm-bindgen = "0.6"

# hash map (EcmaScriptModule conversion)
rustc-hash = "2.0"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
