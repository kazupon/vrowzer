<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bundler Worker Test</title>
    <style>
      body {
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        padding: 20px;
        max-width: 800px;
        margin: 0 auto;
      }
      pre {
        background: #f5f5f5;
        padding: 12px;
        border-radius: 4px;
        overflow-x: auto;
        font-size: 12px;
      }
      .log {
        margin: 8px 0;
        padding: 8px;
        border-left: 3px solid #ccc;
      }
      .log.info {
        border-color: #2196f3;
        background: #e3f2fd;
      }
      .log.success {
        border-color: #4caf50;
        background: #e8f5e9;
      }
      .log.error {
        border-color: #f44336;
        background: #ffebee;
      }
      button {
        padding: 10px 20px;
        font-size: 14px;
        cursor: pointer;
        margin-right: 10px;
      }
      #output {
        margin-top: 20px;
      }
    </style>
  </head>
  <body>
    <h1>Bundler Worker Test</h1>
    <p>Open DevTools console to see detailed logs.</p>

    <div>
      <button id="initBtn">Initialize Worker</button>
      <button id="bundleBtn" disabled>Bundle Test Code</button>
    </div>

    <div id="output"></div>

    <h2>Bundled Code Output:</h2>
    <pre id="bundledCode">Not yet bundled...</pre>

    <script type="module">
      const output = document.getElementById("output");
      const bundledCodePre = document.getElementById("bundledCode");
      const initBtn = document.getElementById("initBtn");
      const bundleBtn = document.getElementById("bundleBtn");

      let worker = null;

      function log(message, type = "info") {
        const div = document.createElement("div");
        div.className = `log ${type}`;
        div.textContent = `[${new Date().toISOString()}] ${message}`;
        output.appendChild(div);
        console.log(`[${type.toUpperCase()}]`, message);
      }

      // Create worker using Vite's worker import
      initBtn.addEventListener("click", async () => {
        log("Creating worker...");

        try {
          // Import worker using Vite's ?worker syntax
          const WorkerModule = await import("./bundler.worker.ts?worker");
          worker = new WorkerModule.default();

          worker.onmessage = (event) => {
            const data = event.data;
            log(
              `Received: ${JSON.stringify(data)}`,
              data.type === "bundle-error" ? "error" : "success",
            );

            if (data.type === "ready") {
              log("Worker is ready!", "success");
              bundleBtn.disabled = false;
            } else if (data.type === "bundle-success") {
              log("Bundle successful!", "success");
              console.log("Bundled code:", data.code);
              bundledCodePre.textContent = data.code;
            } else if (data.type === "bundle-error") {
              log(`Bundle error: ${data.message}`, "error");
            }
          };

          worker.onerror = (error) => {
            log(`Worker error: ${error.message}`, "error");
          };

          // Send init message
          log("Sending init message...");
          worker.postMessage({ type: "init" });
        } catch (err) {
          log(`Failed to create worker: ${err}`, "error");
        }
      });

      bundleBtn.addEventListener("click", () => {
        if (!worker) {
          log("Worker not initialized", "error");
          return;
        }

        const testFiles = {
          "/main.js": `
// Test entry file
import { greet } from './utils.js'

const message = greet('World')
console.log(message)

document.body.innerHTML = '<h1>' + message + '</h1>'

if (import.meta.hot) {
  import.meta.hot.accept(() => {
    console.log('[HMR] Updated!')
  })
}
`,
          "/utils.js": `
// Utility module
export function greet(name) {
  return 'Hello, ' + name + '!'
}
`,
        };

        log("Sending bundle request...");
        worker.postMessage({
          type: "bundle",
          entry: "/main.js",
          files: testFiles,
        });
      });
      console.log("Test page loaded", globalThis);
    </script>
  </body>
</html>
