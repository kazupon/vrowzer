<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 720" font-family="system-ui, -apple-system, sans-serif" font-size="12">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="#666"/>
    </marker>
    <marker id="arrow-blue" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="#4a90d9"/>
    </marker>
    <marker id="arrow-purple" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="#9b59b6"/>
    </marker>
    <marker id="arrow-violet" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="#7a4ad9"/>
    </marker>
    <marker id="arrow-hmr" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="#e74c3c"/>
    </marker>
  </defs>

  <!-- Main Thread -->
  <rect x="30" y="20" width="860" height="110" rx="8" fill="#f0f4ff" stroke="#4a90d9" stroke-width="1.5"/>
  <text x="460" y="40" text-anchor="middle" font-weight="bold" font-size="14" fill="#333">Main Thread</text>

  <rect x="60" y="55" width="140" height="55" rx="6" fill="#fff" stroke="#4a90d9" stroke-width="1"/>
  <text x="130" y="76" text-anchor="middle" font-weight="600" fill="#333">vrowzer</text>
  <text x="130" y="96" text-anchor="middle" font-size="10" fill="#888">Vrowzer()</text>

  <rect x="310" y="55" width="220" height="55" rx="6" fill="#fff" stroke="#4a90d9" stroke-width="1"/>
  <text x="420" y="76" text-anchor="middle" font-weight="600" fill="#333">FileSystemPublisher</text>
  <text x="420" y="96" text-anchor="middle" font-size="10" fill="#888">@vrowzer/fs/watcher</text>

  <rect x="630" y="55" width="230" height="55" rx="6" fill="#fff" stroke="#4a90d9" stroke-width="1"/>
  <text x="745" y="76" text-anchor="middle" font-weight="600" fill="#333">SvcWorkerController</text>
  <text x="745" y="96" text-anchor="middle" font-size="10" fill="#888">@vrowzer/service-worker</text>


  <!-- Service Worker -->
  <rect x="30" y="200" width="400" height="310" rx="8" fill="#fff5f0" stroke="#d97a4a" stroke-width="1.5"/>
  <text x="230" y="222" text-anchor="middle" font-weight="bold" font-size="14" fill="#333">Service Worker</text>

  <!-- SW: Subscriber -->
  <rect x="55" y="240" width="210" height="45" rx="6" fill="#fff" stroke="#d97a4a" stroke-width="1"/>
  <text x="160" y="258" text-anchor="middle" font-weight="600" font-size="11" fill="#333">FileSystemSubscriber</text>
  <text x="160" y="274" text-anchor="middle" font-size="10" fill="#888">@vrowzer/fs/watcher</text>

  <!-- SW: Virtual File System -->
  <rect x="280" y="240" width="130" height="45" rx="6" fill="#fff" stroke="#d97a4a" stroke-width="1"/>
  <text x="345" y="258" text-anchor="middle" font-weight="600" font-size="11" fill="#333">Virtual File System</text>
  <text x="345" y="274" text-anchor="middle" font-size="10" fill="#888">@vrowzer/fs</text>

  <!-- SW: entry -->
  <rect x="55" y="300" width="355" height="42" rx="6" fill="#fff" stroke="#d97a4a" stroke-width="1"/>
  <text x="232" y="318" text-anchor="middle" font-weight="600" font-size="11" fill="#333">vrowzer/service-worker</text>
  <text x="232" y="334" text-anchor="middle" font-size="10" fill="#888">Service Worker entry point</text>

  <!-- SW: vite-dev-server -->
  <rect x="55" y="356" width="355" height="42" rx="6" fill="#fff" stroke="#d97a4a" stroke-width="1"/>
  <text x="232" y="374" text-anchor="middle" font-weight="600" font-size="11" fill="#333">@vrowzer/vite-dev-server/service-worker</text>
  <text x="232" y="390" text-anchor="middle" font-size="10" fill="#888">Vite Dev Server (fetch handler)</text>

  <!-- SW: service-worker-server -->
  <rect x="55" y="412" width="355" height="42" rx="6" fill="#fff" stroke="#d97a4a" stroke-width="1"/>
  <text x="232" y="430" text-anchor="middle" font-weight="600" font-size="11" fill="#333">@vrowzer/service-worker-server</text>
  <text x="232" y="446" text-anchor="middle" font-size="10" fill="#888">SvcWorkerServer</text>


  <!-- Web Worker -->
  <rect x="490" y="200" width="400" height="310" rx="8" fill="#f0fff4" stroke="#4a9d5c" stroke-width="1.5"/>
  <text x="690" y="222" text-anchor="middle" font-weight="bold" font-size="14" fill="#333">Web Worker</text>

  <!-- WW: Subscriber -->
  <rect x="515" y="240" width="210" height="45" rx="6" fill="#fff" stroke="#4a9d5c" stroke-width="1"/>
  <text x="620" y="258" text-anchor="middle" font-weight="600" font-size="11" fill="#333">FileSystemSubscriber</text>
  <text x="620" y="274" text-anchor="middle" font-size="10" fill="#888">@vrowzer/fs/watcher</text>

  <!-- WW: Virtual File System -->
  <rect x="740" y="240" width="130" height="45" rx="6" fill="#fff" stroke="#4a9d5c" stroke-width="1"/>
  <text x="805" y="258" text-anchor="middle" font-weight="600" font-size="11" fill="#333">Virtual File System</text>
  <text x="805" y="274" text-anchor="middle" font-size="10" fill="#888">@vrowzer/fs</text>

  <!-- WW: entry -->
  <rect x="515" y="300" width="355" height="42" rx="6" fill="#fff" stroke="#4a9d5c" stroke-width="1"/>
  <text x="692" y="318" text-anchor="middle" font-weight="600" font-size="11" fill="#333">vrowzer/web-worker</text>
  <text x="692" y="334" text-anchor="middle" font-size="10" fill="#888">Web Worker entry point</text>

  <!-- WW: vite-dev-server/web-worker -->
  <rect x="515" y="356" width="355" height="42" rx="6" fill="#fff" stroke="#4a9d5c" stroke-width="1"/>
  <text x="692" y="374" text-anchor="middle" font-weight="600" font-size="11" fill="#333">@vrowzer/vite-dev-server/web-worker</text>
  <text x="692" y="390" text-anchor="middle" font-size="10" fill="#888">Worker server</text>

  <!-- WW: transformer -->
  <rect x="515" y="412" width="355" height="42" rx="6" fill="#fff" stroke="#4a9d5c" stroke-width="1"/>
  <text x="692" y="430" text-anchor="middle" font-weight="600" font-size="11" fill="#333">@vrowzer/vite-dev-server/transformer</text>
  <text x="692" y="446" text-anchor="middle" font-size="10" fill="#888">DevEnvironment</text>


  <!-- Preview Iframe -->
  <rect x="30" y="580" width="860" height="55" rx="8" fill="#f5f0ff" stroke="#7a4ad9" stroke-width="1.5"/>
  <text x="460" y="613" text-anchor="middle" font-weight="bold" font-size="14" fill="#333">Preview Iframe</text>

  <!-- === Cross-component arrows === -->

  <!-- Publisher → SW Subscriber (V_FS_*) -->
  <path d="M 370 110 L 370 150 L 160 150 L 160 200" fill="none" stroke="#4a90d9" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arrow-blue)"/>
  <text x="265" y="163" text-anchor="middle" font-size="10" fill="#4a90d9" font-weight="600">V_FS_*</text>

  <!-- Publisher → WW Subscriber (V_FS_*) -->
  <path d="M 470 110 L 470 150 L 620 150 L 620 200" fill="none" stroke="#4a90d9" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arrow-blue)"/>
  <text x="545" y="163" text-anchor="middle" font-size="10" fill="#4a90d9" font-weight="600">V_FS_*</text>

  <!-- Controller → SW (register/claim) -->
  <path d="M 745 110 L 745 170 L 340 170 L 340 200" fill="none" stroke="#d97a4a" stroke-width="1.5" stroke-dasharray="5,3"/>
  <text x="545" y="183" text-anchor="middle" font-size="10" fill="#d97a4a" font-weight="600">register / claim</text>

  <!-- RPC (SW ↔ WW) -->
  <line x1="410" y1="428" x2="514" y2="428" stroke="#9b59b6" stroke-width="2" marker-end="url(#arrow-purple)"/>
  <line x1="514" y1="438" x2="410" y2="438" stroke="#9b59b6" stroke-width="2" marker-end="url(#arrow-purple)"/>
  <text x="458" y="420" text-anchor="middle" font-size="10" fill="#9b59b6" font-weight="600">RPC</text>
  <text x="458" y="452" text-anchor="middle" font-size="9" fill="#9b59b6">(MessageChannel)</text>

  <!-- SW → Iframe (HTML/JS/CSS) -->
  <line x1="200" y1="510" x2="200" y2="576" stroke="#7a4ad9" stroke-width="1.5" marker-end="url(#arrow-violet)"/>
  <text x="215" y="548" font-size="10" fill="#7a4ad9" font-weight="600">HTML / JS / CSS</text>

  <!-- Iframe → SW (fetch) -->
  <line x1="340" y1="580" x2="340" y2="510" stroke="#7a4ad9" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arrow-violet)"/>
  <text x="355" y="548" font-size="10" fill="#7a4ad9">fetch /__preview__/</text>

  <!-- HMR: SW → Iframe (MessageChannel) -->
  <line x1="690" y1="510" x2="690" y2="576" stroke="#e74c3c" stroke-width="1.5" marker-end="url(#arrow-hmr)"/>
  <text x="705" y="542" font-size="10" fill="#e74c3c" font-weight="600">HMR update</text>
  <text x="705" y="556" font-size="9" fill="#e74c3c">(MessageChannel)</text>
</svg>
