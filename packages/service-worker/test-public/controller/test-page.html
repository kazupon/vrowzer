<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Service Worker Test Page</title>
  </head>
  <body>
    <h1>Service Worker Test Page</h1>
    <div id="status">Loading...</div>
    <div id="controller-info"></div>
    <div id="version"></div>

    <script type="module">
      const statusEl = document.getElementById('status')
      const controllerInfoEl = document.getElementById('controller-info')
      const versionEl = document.getElementById('version')

      // Get version from URL query parameter
      const params = new URLSearchParams(window.location.search)
      const swVersion = params.get('version') || 'v1'
      const swPath = params.get('sw') || `/controller/${swVersion}-basic.js`

      async function getSWVersion(sw) {
        return new Promise((resolve) => {
          const ch = new MessageChannel()
          ch.port1.onmessage = (e) => {
            resolve(e.data?.version ?? null)
          }
          sw.postMessage({ type: 'VROWSER_SW_VERSION' }, [ch.port2])
        })
      }

      async function init() {
        try {
          statusEl.textContent = 'Registering service worker...'

          const registration = await navigator.serviceWorker.register(swPath, {
            scope: '/controller/'
          })

          statusEl.textContent = 'Service worker registered'

          // Wait for SW to be active
          const sw = registration.installing || registration.waiting || registration.active
          if (sw) {
            if (sw.state !== 'activated') {
              await new Promise((resolve) => {
                sw.addEventListener('statechange', function handler() {
                  if (sw.state === 'activated') {
                    sw.removeEventListener('statechange', handler)
                    resolve()
                  }
                })
              })
            }
          }

          statusEl.textContent = 'Service worker activated'

          // Get version
          if (registration.active) {
            const version = await getSWVersion(registration.active)
            versionEl.textContent = `Version: ${version}`
          }

          // Controller info
          if (navigator.serviceWorker.controller) {
            controllerInfoEl.textContent = `Controller: ${navigator.serviceWorker.controller.scriptURL}`
          } else {
            controllerInfoEl.textContent = 'No controller (reload may be needed)'
          }

          // Listen for controller changes
          navigator.serviceWorker.addEventListener('controllerchange', () => {
            controllerInfoEl.textContent = `Controller changed: ${navigator.serviceWorker.controller?.scriptURL}`
          })

        } catch (error) {
          statusEl.textContent = `Error: ${error.message}`
        }
      }

      init()
    </script>
  </body>
</html>
