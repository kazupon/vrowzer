packages:
  - packages/*

catalog:
  '@types/node': ^25.0.3
  publint: ^0.3.16
  tsdown: 0.18.4
  typedoc: ^0.28.15
  typedoc-plugin-markdown: ^4.9.0
  '@playwright/test': 1.57.0
  get-port-please: ^3.2.0
  vite: 8.0.0-beta.4
  rolldown: ^1.0.0-beta.60

minimumReleaseAge: 1440

minimumReleaseAgeExclude:
