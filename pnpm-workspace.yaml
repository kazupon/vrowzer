packages:
  - packages/*
  - e2e/vite-*
  - examples/*

catalog:
  '@kazupon/jts-utils': ^0.17.0
  '@playwright/test': 1.57.0
  '@types/node': ^25.5.0
  get-port-please: ^3.2.0
  magic-string: ^0.30.21
  oxlint: ^1.57.0
  publint: ^0.3.18
  rolldown: 1.0.0-rc.9
  tsdown: 0.18.4
  typedoc: ^0.28.18
  typedoc-plugin-markdown: ^4.11.0
  vite: ^8.0.3
  vitest: ^4.1.1
  pathe: ^2.0.3
  '@oxc-project/types': 0.110.0
  obug: ^2.1.1
  buffer: ^6.0.3
  readable-stream: ^4.7.0
  wrangler: ^4.77.0 # for cloudflare pages deploying on github actions
  vue: ^3.5.31
  react: ^19.2.4
  react-dom: ^19.2.4
  svelte: ^5.55.0
  '@sveltejs/vite-plugin-svelte': ^6.2.4
  '@vitejs/plugin-react': 5.1.4
  '@vitejs/plugin-vue': ^6.0.5
  '@vitejs/devtools': latest

minimumReleaseAge: 1440

minimumReleaseAgeExclude:
  - '@kazupon/prettier-config'
  - '@kazupon/eslint-config'
  - '@kazupon/jts-utils'
  - '@vitejs/devtools'
  - '@vitejs/devtools-kit'
  - '@vitejs/devtools-rolldown'
  - '@vitejs/devtools-rpc'
  - eslint-plugin-oxlint
  - knip
  - oxlint
  - vite

onlyBuiltDependencies:
  - '@rolldown/browser'
  - core-js
  - deno
  - esbuild

patchedDependencies:
  fdir@6.5.0: patches/fdir@6.5.0.patch
