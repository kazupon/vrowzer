packages:
  - packages/*
  - e2e/hosts/*

catalog:
  '@kazupon/jts-utils': ^0.17.0
  '@playwright/test': 1.57.0
  '@types/node': ^25.3.0
  get-port-please: ^3.2.0
  magic-string: ^0.30.21
  oxlint: ^1.50.0
  publint: ^0.3.17
  rolldown: 1.0.0-rc.1
  tsdown: 0.18.4
  typedoc: ^0.28.17
  typedoc-plugin-markdown: ^4.10.0
  vite: 8.0.0-beta.12
  vitest: ^4.0.18
  pathe: ^2.0.3
  obug: ^2.1.1
  buffer: ^6.0.3
  readable-stream: ^4.7.0

minimumReleaseAge: 1440

minimumReleaseAgeExclude:
  - '@kazupon/prettier-config'
  - '@kazupon/eslint-config'
  - '@kazupon/jts-utils'
  - eslint-plugin-oxlint
  - knip
  - oxlint

onlyBuiltDependencies:
  - '@rolldown/browser'
  - core-js
  - deno
  - esbuild

patchedDependencies:
  fdir@6.5.0: patches/fdir@6.5.0.patch
